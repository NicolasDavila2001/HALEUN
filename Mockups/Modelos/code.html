<script>
  (function () {
    const cards = document.querySelectorAll('.model-card');
    const selectedLabel = document.getElementById('selected-label');
    const refreshBtn = document.getElementById('browser-refresh');
    const backBtn = document.getElementById('browser-back');
    const confirmBtn = document.getElementById('confirm-selection');

    const modelNames = {
      'chatgpt-4o': 'Chat GPT-4o',
      'claude-3-5': 'Claude 3.5 Sonnet',
      'gemini-1-5': 'Gemini 1.5 Pro',
      'gpt-5': 'GPT-5 Preview'
    };

    cards.forEach(card => {
      card.addEventListener('click', () => {
        // Reset state on all cards
        cards.forEach(c => {
          c.classList.remove('bg-surface-container-low', 'shadow-md');
          c.classList.add('bg-surface-container-lowest', 'shadow-sm');
          const indicator = c.querySelector('.selection-indicator');
          if (indicator) {
            indicator.className = 'selection-indicator w-6 h-6 rounded-full bg-surface-container flex items-center justify-center text-transparent shrink-0 transition-colors';
          }
        });

        // Activate clicked card
        card.classList.remove('bg-surface-container-lowest', 'shadow-sm');
        card.classList.add('bg-surface-container-low', 'shadow-md');
        const activeIndicator = card.querySelector('.selection-indicator');
        if (activeIndicator) {
          activeIndicator.className = 'selection-indicator w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary shrink-0 shadow-sm transition-colors';
        }

        const modelKey = card.getAttribute('data-model');
        if (selectedLabel && modelNames[modelKey]) {
          selectedLabel.textContent = modelNames[modelKey];
        }
      });
    });

    if (refreshBtn) {
      refreshBtn.addEventListener('click', () => {
        refreshBtn.classList.add('animate-spin');
        setTimeout(() => refreshBtn.classList.remove('animate-spin'), 650);
      });
    }

    if (backBtn) {
      backBtn.addEventListener('click', () => {
        window.history.length > 1 ? window.history.back() : null;
      });
    }

    if (confirmBtn) {
      confirmBtn.addEventListener('click', () => {
        const currentModel = selectedLabel ? selectedLabel.textContent : 'el modelo seleccionado';
        alert('Has seleccionado exitosamente ' + currentModel + ' para tu sesión conversacional de HALEUN.');
      });
    }
  })();
</script></main>
